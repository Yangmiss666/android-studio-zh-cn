gradle.cmd.option.help=显示帮助消息。
gradle.cmd.option.version=打印版本信息。
gradle.cmd.option.show.version=打印版本信息并继续。
gradle.cmd.option.build.file=指定构建文件。
gradle.cmd.option.settings.file=指定设置文件。
gradle.cmd.option.full.stacktrace=打印所有异常完整的(非常详细)堆栈跟踪。
gradle.cmd.option.stacktrace=打印所有异常的堆栈跟踪。
gradle.cmd.option.scan=创建构建扫描。如果尚未应用构建扫描插件，Gradle 将发出警告。
gradle.cmd.option.no.scan=禁用创建构建扫描。
gradle.cmd.option.develocity.url=用于发布构建扫描的 Develocity 服务器的默认 URL。如果尚未应用 Develocity 插件，将触发自动应用。
gradle.cmd.option.develocity.plugin.version=自动应用的 Develocity 插件版本。仅当 --develocity-url 或 --scan 触发自动应用 Develocity 插件时使用。
gradle.cmd.option.task.graph=打印任务图，而不是执行任务。
gradle.cmd.option.problems.report=启用 HTML 问题报告。
gradle.cmd.option.no.problems.report=禁用 HTML 问题报告。
gradle.cmd.option.property.upgrade.report=使用实验性属性升级报告运行构建。
gradle.cmd.option.build.cache=启用 Gradle 构建缓存。Gradle 将尝试复用先前构建的输出。
gradle.cmd.option.no.build.cache=禁用 Gradle 构建缓存。
gradle.cmd.option.configuration.cache=启用配置缓存。Gradle 将尝试复用先前构建的构建配置。
gradle.cmd.option.no.configuration.cache=禁用配置缓存。
gradle.cmd.option.configuration.cache.problems=配置配置缓存处理问题的方式(失败或警告)。默认为失败。
gradle.cmd.option.configure.on.demand=仅配置必要的项目。Gradle 将尝试减少大型多项目构建的配置时间。
gradle.cmd.option.no.configure.on.demand=禁用按需配置。
gradle.cmd.option.max.workers=配置允许 Gradle 使用的并发工作进程数。
gradle.cmd.option.parallel=并行构建项目。Gradle 将尝试确定要使用的最佳执行器线程数。
gradle.cmd.option.no.parallel=禁用并行执行以构建项目。
gradle.cmd.option.priority=指定 Gradle 守护进程及其启动的所有进程的调度优先级。值为 'normal'(默认)或 'low'。
gradle.cmd.option.profile=分析构建执行时间并在 <build_dir>/reports/profile 目录中生成报告。
gradle.cmd.option.watch.fs=启用监视文件系统更改，使文件系统的数据可用于下一次构建。
gradle.cmd.option.no.watch.fs=禁用监视文件系统。
gradle.cmd.option.isolated.projects=启用独立项目。项目将并行配置。隐含 --configuration-cache。
gradle.cmd.option.no.isolated.projects=禁用独立项目。
gradle.cmd.option.quiet=仅记录错误。
gradle.cmd.option.warn=将日志级别设置为警告。
gradle.cmd.option.info=将日志级别设置为信息。
gradle.cmd.option.debug=以调试模式记录(包含常规堆栈跟踪)。
gradle.cmd.option.console=指定要生成的控制台输出类型。值为 'plain'、'auto'(默认)、'rich' 或 'verbose'。
gradle.cmd.option.console.unicode=指定控制台输出中允许的字符类型。值为 'auto'(默认)、'disable' 或 'enable'。
gradle.cmd.option.non.interactive=不进行交互式提示。
gradle.cmd.option.warning.mode=指定要生成的警告模式。值为 'all'、'fail'、'summary'(默认)或 'none'。
gradle.cmd.option.include.build=将指定的构建包含到复合构建中。
gradle.cmd.option.offline=在不访问网络资源的情况下执行构建。
gradle.cmd.option.refresh.dependencies=刷新依赖项的状态。
gradle.cmd.option.dry.run=在禁用所有任务操作的情况下运行构建。
gradle.cmd.option.write.locks=为锁定的配置持久化依赖项解析，忽略现有的锁定信息(如果存在)。
gradle.cmd.option.update.locks=执行依赖项锁定的部分更新，允许传入的模块记法更改版本。
gradle.cmd.option.no.rebuild=不重新构建项目依赖项。
gradle.cmd.option.gradle.user.home=指定 Gradle 用户主目录。
gradle.cmd.option.project.dir=指定 Gradle 的启动目录。默认为当前目录。
gradle.cmd.option.project.cache.dir=指定项目特定的缓存目录。默认为根项目目录中的 .gradle。
gradle.cmd.option.system.prop=设置 JVM 的系统属性(例如 -Dmyprop\=myvalue)。
gradle.cmd.option.init.script=指定初始化脚本。
gradle.cmd.option.project.prop=设置构建脚本的项目属性(例如 -Pmyprop\=myvalue)。
gradle.cmd.option.exclude.task=指定要从执行中排除的任务。
gradle.cmd.option.rerun.tasks=忽略先前缓存的任务结果。
gradle.cmd.option.rerun=忽略先前缓存的特定任务结果。
gradle.cmd.option.continue=在任务失败后继续执行任务。
gradle.cmd.option.no.continue=在任务失败后停止执行任务。
gradle.cmd.option.continuous=连续构建允许您在任务输入发生变化时自动重新执行所请求的任务。
gradle.cmd.option.export.keys=导出用于依赖项验证的公钥。
gradle.cmd.option.refresh.keys=刷新用于依赖项验证的公钥。
gradle.cmd.option.dependency.verification=配置依赖项验证模式(strict、lenient 或 off)
gradle.cmd.option.write.verification.metadata=为项目中使用的依赖项生成校验和(逗号分隔列表)。
gradle.cmd.option.daemon=使用 Gradle 守护进程运行构建。如果守护进程未运行，则启动它。
gradle.cmd.option.no.daemon=不使用 Gradle 守护进程运行构建。如果您已将 Gradle 配置为默认始终使用守护进程运行，偶尔会很有用。
gradle.cmd.option.status=显示正在运行和最近停止的 Gradle 守护进程的状态。
gradle.cmd.option.stop=如果 Gradle 守护进程正在运行，则停止它。
gradle.cmd.option.foreground=在前台启动 Gradle 守护进程。
