gemma.max.draft.tokens.label=多令牌预测 (MTP) 草稿令牌：
gemma.max.draft.tokens.comment=投机解码会在每一步生成多个候选令牌以加速生成。较高的草稿令牌数量可以在性能足够的硬件上提高推理速度，但如果推测准确率较低，可能会增加内存使用量或降低性能。 <a href="https://blog.google/innovation-and-ai/technology/developers-tools/multi-token-prediction-gemma-4/">了解详情</a>
gemma.max.draft.tokens.tooltip=<b>多令牌预测 (MTP)</b><br><br>使用投机解码并行预测多个未来的令牌。<br><br><b>草稿令牌权衡：</b><br>• <b>0：</b>禁用。<br>• <b>1–2 个令牌：</b>中等加速，内存开销最小。推荐用于大多数系统。<br>• <b>3–6 个令牌：</b>在性能强大的 GPU 上可能有更高的加速，但会增加内存开销，并在预测被拒绝时提高成本。
gemma.max.draft.tokens.disabled=0（禁用）
gemma.max.draft.tokens.single=1 个草稿令牌
gemma.max.draft.tokens.multiple={0} 个草稿令牌
