local.studiobot.settings.warning=<head></head><p>使用第三方模型即表示您同意将您的代码和其他输入数据发送给该提供商。Google 不会访问或处理您与第三方模型的交互。<br><br>所有数据（包括您的文件、提示词和模型的响应）都会直接发送给第三方模型提供商。AI 可能会犯错，请谨慎使用代码。</p>
local.studiobot.settings.warning.note=<head></head><p>请注意，某些 Android Studio 功能可能无法与外部模型按预期正常工作。</p>
