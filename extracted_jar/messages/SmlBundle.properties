sml.studiobot.onboarding.aida.simplified.step2.privacy.blurb1.markdown=下方显示的隐私声明和 Google [隐私权政策](https://policies.google.com/privacy) 说明了 Gemini 如何处理您的数据。
sml.studiobot.onboarding.aida.simplified.step2.privacy.blurb2.markdown=当您在 {0} 中使用 Gemini 时，Google 会收集聊天文本、提示、相关代码、生成的输出、相关功能使用信息以及您的反馈。Google 使用这些数据来提供、改进和开发 Google 产品与服务以及机器学习技术，包括 Google 的企业产品（如 Google Cloud）。\n\n为了帮助保证质量并改进我们的产品，人工审核人员可能会阅读、标注和处理您的提示、相关代码、生成的输出、相关功能使用信息以及您的反馈。您的数据将保留最长 18 个月，并以 Google 无法辨别提供者的方式存储。在此期间，Google 无法满足删除请求。\n\n**请勿在您的提示或反馈中包含可用于识别您或他人的敏感（例如机密）或个人信息。**
sml.studiobot.onboarding.aida.simplified.step3.greeting.secondLine=获取为您量身定制的响应
sml.studiobot.onboarding.aida.simplified.step3.context.title=使用项目上下文
sml.studiobot.onboarding.aida.simplified.step3.context.blurb.markdown=使用项目上下文有助于生成更贴合您的代码库和项目的代码。确认您希望以哪个设置开始。这些设置可随时在 **设置 > 工具 > {0}** 中更改。
sml.studiobot.onboarding.aida.simplified.step3.context.allowContext.radiobutton.text=使用所有 Gemini 功能（推荐）
sml.studiobot.onboarding.aida.simplified.step3.context.allowContext.info.markdown=允许使用项目上下文以获得对所有 Gemini 功能的完全访问权限。\n\n您还可以在项目中使用 .aiexclude 文件来排除特定文件和目录。[了解详情](https://d.android.com/r/studio-ui/gemini/data-and-privacy/aiexclude)
sml.studiobot.onboarding.aida.simplified.step3.context.allowContext.dontAskAgain.text=应用于所有项目
sml.studiobot.onboarding.aida.simplified.step3.context.noContext.radiobutton.text=仅使用聊天，不使用项目上下文
sml.studiobot.onboarding.aida.simplified.step3.context.noContext.info.text=不允许使用项目上下文，将对 Gemini 功能的访问受限。Gemini 仅使用您的提示和过往对话历史来作出响应。在此模式下，某些功能（例如 AI 代码补全）将不可用。
