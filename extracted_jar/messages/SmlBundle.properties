sml.studiobot.timeline.emptyState.agentMode.accessAi.consumer.markdown=**更多使用 AI 的方式**\n\n[升级到符合条件的 Google AI 套餐]({0})\u2197 以通过订阅访问 Gemini，或提供 API 密钥以使用 [Anthropic]({1})、[OpenAI]({2}) 和 [通过 AI Studio 使用 Gemini]({3})。对于离线开发，可通过本地 LLM 主机运行[本地模型]({4})。
