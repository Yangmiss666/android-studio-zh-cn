debug.selfProfiling.dialog.text=\
  IDE 将在单独的进程中启动新的 ETW 分析会话。<br/>\
  它将捕获关于会话启动时正在运行或将要启动的调试器进程的采样信息。<br/>\
  <br/>\
  要启动 ETW 会话，Windows 将提示需要管理员权限。<br/>\
  <br/>\
  完成后，使用状态栏中的控件停止分析会话。<br/>\
  请勿通过 Windows 任务管理器终止 ETW 进程：<br/>\
  ETW 会话在应用程序生命周期结束后仍会保留，需要重启 Windows 才能停止该会话。
