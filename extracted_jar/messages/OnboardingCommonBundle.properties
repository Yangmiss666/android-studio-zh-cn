sml.gias.tier.free.upgrade.message=此基础层级随 Android Studio 提供，让您可以探索 Gemini 如何增强您的开发工作流。\n\n它适用于没有 Google One 方案的 Google 账号，以及拥有不符合条件的 Google One 方案的账号。\n\n[升级到符合条件的 Google AI 方案](https://one.google.com/ai?g1_landing_page=75)\u2197 以获得更高的限额并访问更大的模型。
sml.gias.tier.enterprise.upgrade.message=您的组织提供了对 Android Studio 企业版中 Gemini 的访问权限。此方案为 Gemini 提供更高的每日配额，旨在支持繁重的开发工作负载而不中断。
