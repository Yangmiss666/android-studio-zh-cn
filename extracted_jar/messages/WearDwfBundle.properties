inspection.unknown.wff.version.description=未知的 Watch Face Format 版本
inspection.invalid.color.index.description=<html>\
  颜色配置可将多种颜色作为一个调色板的一部分。如果有多种颜色，配置引用必须指定该调色板中颜色的索引。例如：[CONFIGURATION.myColor.0]。如果调色板只有一种颜色，则索引是可选的。\
  <br/>\
  在 <a href="https://developer.android.com/reference/wear-os/wff/user-configuration/color-configuration">ColorConfiguration</a> 文档中了解更多。\
  </html>
inspection.invalid.color.index.missing.index=必须指定 {0} 范围内的颜色索引
inspection.invalid.color.index.invalid.index.in.range=颜色索引必须是 {0} 范围内的整数
inspection.invalid.color.index.invalid.index.optional=颜色索引是可选的，如果指定则必须为 0
inspection.invalid.color.index.missing.colors=颜色配置必须在 ColorOption 中声明至少一种颜色
inspection.invalid.complication.data.source.location.description=<html>\
  复杂功能数据源只能在声明式表盘中的 <code>&lt;Complication&gt;</code> 标签下使用。\
  可用的复杂功能数据源取决于复杂功能的类型。 \
  <br/>\
  在 <a href="https://developer.android.com/reference/wear-os/wff/user-configuration/color-configuration">ColorConfiguration</a> 文档中了解更多。\
  </html>
inspection.invalid.complication.data.source.location.missing.tag=复杂功能数据源必须在 <Complication> 标签内使用
inspection.invalid.complication.data.source.location.available.complication.types=此复杂功能数据源只能用于以下类型的复杂功能：{0}
