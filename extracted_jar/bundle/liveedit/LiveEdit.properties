le.status.in_progress.title=更新进行中
le.status.in_progress.description=Live Edit 更新进行中。
le.status.loading.title=正在加载
le.status.loading.description=应用正在部署...
le.status.up_to_date.title=最新
le.status.up_to_date.description_auto=应用已是最新。代码更改将自动应用到正在运行的应用。
le.status.up_to_date.description_manual=应用已是最新。代码更改将在刷新时应用到正在运行的应用。
le.status.out_of_date.title=已过期
le.status.out_of_date.description=刷新以查看最新的 Live Edit 更改。应用状态可能会重置。
le.status.no_multi_deploy.description=由于最近部署到了另一台设备，Live Edit 已在此设备上自动禁用。
le.status.recompose_needed.title=需要重新组合
le.status.recompose_needed.description=必须执行硬刷新才能应用所有更改。应用状态将被重置。
le.status.error.recompose.title=重新组合错误
le.status.error.recompose.description=应用在重新组合期间遇到意外异常，已恢复到上次成功组合的状态。
le.status.error.debugger_attached.title=不支持 Live Edit
le.status.error.debugger_attached.description=应用当前正在调试模式下运行。此模式与 Live Edit 不兼容。
le.status.error.gradle_sync.title=需要 Gradle 同步
le.status.error.gradle_sync.description=需要执行 Gradle 同步。请同步并重新运行应用。
le.status.error.unsupported_version.title=不支持的 API
le.status.error.unsupported_version.description=将模拟器/设备 API 级别更新到 30 或更高，以查看最新的 Live Edit 更改。
le.status.error.unsupported_version_other.description=部分部署了应用的设备未使用 API 级别 30 或更高。在所有已部署设备都支持 Live Edit 之前，Live Edit 已停止。
le.status.pre_compiling.title=正在准备当前文件
le.status.pre_compiling.description=为当前文件创建差异基线
le.build.redeploy.title=重新构建并重新部署
le.build.redeploy.description=将应用刷新到设备。

le.save.deploy.title=保存并部署更改
